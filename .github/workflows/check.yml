name: Check

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # The LoD2 packages keep their own dependencies (npm run check:lod2).
      - run: for p in lod2-core lod2-ingest lod2-api; do npm ci --prefix lod2/$p; done
      # Everything but the server, which the server job below checks against its own Postgres.
      - run: npm run typecheck && npm run lint && npm run test && npm run check:lod2
        env:
          # The random multi-user sessions of src/sync/convergence.test.ts.
          CONVERGENCE_SEEDS: "1000"
      # The IFC export read back by IfcOpenShell, which uv fetches.
      - uses: astral-sh/setup-uv@v6
      - run: npm run check:ifc
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bauwerk
          POSTGRES_PASSWORD: bauwerk
          POSTGRES_DB: bauwerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bauwerk -d bauwerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm ci --legacy-peer-deps
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npm run check
        working-directory: server
        env:
          DATABASE_URL: postgres://bauwerk:bauwerk@localhost:5432/bauwerk_test
