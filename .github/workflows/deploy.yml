name: Deploy to GitHub Pages

# Only when started by hand: the hosted demo runs on a server (deploy/README.md), and Pages is
# not enabled for the private repository, so a run on every push only failed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # The LoD2 packages keep their own dependencies (npm run check:lod2).
      - run: for p in lod2-core lod2-ingest lod2-api; do npm ci --prefix lod2/$p; done
      # The app and LoD2 checks; the server's need a database and run in the Check workflow.
      - run: npm run typecheck && npm run lint && npm run test && npm run check:lod2
      - run: npm run build
        env:
          VITE_BASE_PATH: /bauwerk/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The github-pages environment is configured with a required reviewer,
    # so this job waits for a manual approval before it publishes.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
